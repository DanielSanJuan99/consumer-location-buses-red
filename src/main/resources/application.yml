server:
  port: 8083

spring:
  application:
    name: consumer-location-buses-red
  
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  
  datasource:
    url: jdbc:oracle:thin:@bdbusesred_high?TNS_ADMIN=${WALLET_PATH:/app/wallet}
    username: ${ORACLE_USERNAME:ADMIN}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      connection-test-query: SELECT 1 FROM DUAL
  
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false
        use_sql_comments: false
        show_sql: false
        generate_statistics: false

rabbitmq:
  exchange:
    location: location.exchange
  queue:
    location: location.queue
  routing-key:
    location: location.routing.key

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.busesred: INFO
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
